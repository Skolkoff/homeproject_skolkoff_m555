[project]
name = "finalproject_skolkoff_m555"
version = "0.1.0"
description = "ValutaTrade Hub currency trading simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.16.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = ["ruff>=0.14.0"]
